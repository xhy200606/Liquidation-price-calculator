[package]
name = "liquidation-price-calculator"
version = "0.1.0"
description = "A lightweight macOS liquidation price calculator."
authors = ["Codex"]
edition = "2021"

[lib]
name = "liquidation_price_calculator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.5.0", features = ["macos-private-api"] }
tauri-plugin-opener = "2.2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
